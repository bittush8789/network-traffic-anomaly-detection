apiVersion: apps/v1
kind: Deployment
metadata:
  name: netshield-deployment
  labels:
    app: netshield-ai
    tier: api-ml
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: netshield-ai
  template:
    metadata:
      labels:
        app: netshield-ai
        tier: api-ml
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: netshield-app
          image: netshield-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http-api
          envFrom:
            - configMapRef:
                name: netshield-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: storage-volume
              mountPath: /app/data
              subPath: data
            - name: storage-volume
              mountPath: /app/models
              subPath: models
            - name: storage-volume
              mountPath: /app/mlruns
              subPath: mlruns
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: netshield-storage-pvc
